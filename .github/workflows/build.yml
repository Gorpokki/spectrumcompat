name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build with Gradle
        run: ./gradlew build

      - name: Read mod version
        id: meta
        run: echo "version=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-jar
          path: build/libs/spectrumcompat-${{ steps.meta.outputs.version }}.jar
          if-no-files-found: error

  boot-check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The jar built from this commit must boot cleanly.
          - jar: built
            expect: pass
          # Control: the last upstream release (0.1.0) crashes in
          # ChickenVariantLockMixin with Vanilla Backport 1.2.2, so the check
          # must fail on it. Proves the check detects the crash.
          - jar: release-0.1.0
            expect: fail
    name: boot-check (${{ matrix.jar }}, expect ${{ matrix.expect }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download built jar
        if: matrix.jar == 'built'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod-jar
          path: jar

      - name: Download release 0.1.0 jar
        if: matrix.jar == 'release-0.1.0'
        run: |
          mkdir jar
          curl -sSfL -o jar/spectrumcompat-0.1.0.jar https://cdn.modrinth.com/data/qOH00thQ/versions/wwlaRlK1/spectrumcompat-0.1.0.jar
          echo "03b15a41c2b3796fe7668518643b664bd5ed89b04b3a4fedf084f01d574ec8af  jar/spectrumcompat-0.1.0.jar" | sha256sum -c -

      - name: Boot dedicated server
        run: |
          set +e
          .github/boot-check.sh jar/*.jar "$RUNNER_TEMP/server"
          status=$?
          set -e
          if [ "${{ matrix.expect }}" = pass ]; then exit $status; fi
          [ $status -ne 0 ] || { echo "expected the boot check to fail on this jar"; exit 1; }
          grep -q 'Mixin apply for mod spectrumcompat failed' "$RUNNER_TEMP/server/server.log"

      - name: Stop server
        if: always()
        run: pkill -f 'neoforge/.*/unix_args.txt' || true

  publish:
    needs: [build, boot-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/spectrumcompat
    steps:
      - name: Download built jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod-jar

      - name: Setup oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          checksum: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0

      - name: Push jar to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          image="${IMAGE,,}"
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          jar="spectrumcompat-$VERSION.jar"
          oras push "$image:$VERSION,${GITHUB_SHA::7}" \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            "$jar:application/java-archive"
          sha256sum "$jar"

      - name: Verify package is private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility=$(gh api "/users/${{ github.repository_owner }}/packages/container/spectrumcompat" --jq .visibility)
          echo "visibility: $visibility"
          [ "$visibility" = private ]
